# Docker images (CPU and CUDA), pushed to the GitHub Container Registry for every
# version tag (v1.2.3 -> ghcr.io/<owner>/extraits:1.2.3, :latest, :1.2.3-cuda, :cuda).
name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            file: docker/Dockerfile
            suffix: ""
          - flavor: cuda
            file: docker/Dockerfile.cuda
            suffix: "-cuda"
    steps:
      - name: Free disk space (the CUDA base image is large)
        if: matrix.flavor == 'cuda'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/extraits
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=ref,event=branch,suffix=${{ matrix.suffix }}
            type=raw,value=latest,enable=${{ matrix.flavor == 'cpu' && startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=cuda,enable=${{ matrix.flavor == 'cuda' && startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}
