# The only place that declares path roots. Every root is in the WORKSPACE (see
# extraits/workspace.py), never in the source tree. `extraits train pose` and
# `extraits pose <verb>` set paths.root (--workspace / $EXTRAITS_WORKSPACE), paths.retained
# (--models-dir / $EXTRAITS_MODELS) and paths.configs; any key can be overridden:
#   extraits pose train paths.runs=/scratch/runs
#
#   <workspace>/annotations/annotation_data.csv   annotation table (input)
#   <workspace>/images/<order>/...                annotated images (input)
#   <workspace>/data/pose/                        prepared tables and folds
#   <workspace>/runs/                             one folder per run
#   <workspace>/results/pose/                     aggregated tables and figures
#   <workspace>/models/pose/                      retained ensemble, read by `extraits process`
#
# None of these keys enters the run_id or the variant_hash (context.py): a run keeps its
# identity on another machine or in another workspace.
paths:
  root: ${oc.env:EXTRAITS_WORKSPACE,.}
  annotation_table: ${paths.root}/annotations/annotation_data.csv
  # Root of the images: the image_path of the prepared annotations is relative to it.
  images: ${paths.root}/images
  data: ${paths.root}/data/pose
  raw: ${paths.data}/raw
  interim: ${paths.data}/interim
  processed: ${paths.data}/processed
  splits: ${paths.data}/splits
  runs: ${paths.root}/runs
  results: ${paths.root}/results/pose
  reports: ${paths.results}/reports
  # Set by the command line to the configs folder shipped with the package.
  configs: ${paths.root}/configs
  # Retained models: <retained>/pose/ is the ensemble `extraits process` reads.
  retained: ${oc.env:EXTRAITS_MODELS,${paths.root}/models}
