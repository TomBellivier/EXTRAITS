# @package _global_
data:
  scope: coleoptera
  datasets: [coleoptera]
  # ADR-0017: one image = one insect. Violated => blocking error at preparation.
  single_instance_per_image: true
  # ADR-0016: some keypoints do not exist in every insect order.
  coverage:
    absent_max: 0.01            # <= this annotation rate => point considered absent
    rare_max: 0.5               # < this rate => rare point, per-point PCK not very informative
    measurement_min_rate: 0.5   # < this rate => measurement not usable for this dataset
  adapter: annotation_csv       # name registered in the 'adapter' registry
  raw_subdir: coleoptera
  keypoint_schema: insect42_v1   # ADR-0006: schema common to the 4 datasets
  adapter_options:
    # Single annotation table: pose + scale + measurement validity, one row per image.
    # The rows are filtered on the 'group' column, which holds the insect order.
    # The table is paths.annotation_table (<workspace>/annotations/annotation_data.csv);
    # set csv_path here only to read another one.
    group_column: group
    margin: 10                  # margin in pixels around the keypoints for the bbox
    # An annotated image missing from images/<order>/ is left out with a warning
    # (false: the YOLO export fails on the first missing image).
    skip_missing_images: true
